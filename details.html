<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase - Transport Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h2>TravelEase</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="mybookings.html">My Bookings</a>
    </nav>
</header>

<main class="page-container">
    <h1>Transport Details</h1>

    <div class="card">
        <h2 id="transportName">Express Travels</h2>
        <p>Transport Type: <span id="transportType">Bus</span></p>
        <p>From: <span id="detailSource"></span></p>
        <p>To: <span id="detailDestination"></span></p>
        <p>Departure: 08:00 AM</p>
        <p>Arrival: 12:00 PM</p>
        <p>Duration: 4 Hours</p>
        <p>Fare: ₹500</p>
        <p>Available Seats: 25</p>

        <button onclick="location.href='seat.html'">Select Seats</button>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
